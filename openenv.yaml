spec_version: 1
name: chirag-env
version: "1.0.0"
description: CHIRAG - Contextual Helper for IIT Resolution and Guidance
type: environment

runtime:
  app: server.app:app
  port: 7860

tasks:
  - id: task_easy
    name: Easy - Direct Factual Retrieval
    difficulty: easy
    reward_range: [0.001, 0.999]
    grader: graders/easy_grader.py

  - id: task_medium
    name: Medium - Multi-Chunk Reasoning
    difficulty: medium
    reward_range: [0.001, 0.999]
    grader: graders/medium_grader.py

  - id: task_hard
    name: Hard - Ambiguity Detection
    difficulty: hard
    reward_range: [0.001, 0.999]
    grader: graders/hard_grader.py
