spec_version: 1
name: chirag-env
version: "1.0.0"
description: CHIRAG - Contextual Helper for IIT Resolution and Guidance
type: environment

runtime:
  app: app:app
  port: 7860

tasks:
  - id: task_easy
    name: Easy Task
    difficulty: easy
    grader: graders.easy_grader:EasyGrader

  - id: task_medium
    name: Medium Task
    difficulty: medium
    grader: graders.medium_grader:MediumGrader

  - id: task_hard
    name: Hard Task
    difficulty: hard
    grader: graders.hard_grader:HardGrader
