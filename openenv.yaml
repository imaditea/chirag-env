cat > openenv.yaml << 'EOF'
name: CHIRAGEnv
description: Student Query Resolution RL Environment for IIT Online Degree Students
version: "1.0"
author: Aditi Singh

tasks:
  - id: task_easy
    name: Basic Query Resolution
    difficulty: easy
    grader: graders.easy_grader:EasyGrader

  - id: task_medium
    name: Multi-topic Queries
    difficulty: medium
    grader: graders.medium_grader:MediumGrader

  - id: task_hard
    name: Ambiguous Queries
    difficulty: hard
    grader: graders.hard_grader:HardGrader
EOF
