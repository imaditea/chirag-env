[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chirag-env"
version = "1.0.0"
description = "CHIRAG - Contextual Helper for IIT Resolution and Guidance"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "openai>=1.0.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
tasks = [
    {id = "task_easy", name = "Easy - Direct Factual Retrieval", difficulty = "easy", grader = "graders/easy_grader.py"},
    {id = "task_medium", name = "Medium - Multi-Chunk Reasoning", difficulty = "medium", grader = "graders/medium_grader.py"},
    {id = "task_hard", name = "Hard - Ambiguity Detection", difficulty = "hard", grader = "graders/hard_grader.py"},
]

[project.urls]
Homepage = "https://huggingface.co/spaces/imaditea/chirag-env"
